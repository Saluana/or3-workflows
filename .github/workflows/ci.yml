name: CI

on:
  push:
    branches: [master, main, 'cursor/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck core
        run: bun run --filter or3-workflow-core typecheck

      - name: Test core
        run: bun run --filter or3-workflow-core test

      - name: Build packages
        run: bun run build
